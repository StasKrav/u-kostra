<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>У Костра</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="app">
  <aside class="glades" id="glades"></aside>

  <main class="main-area">
    <div class="top-bar">
      <div class="glade-title">
        <span class="label">Поляна</span>
        <span class="title" id="glade-title">Общий костёр</span>
      </div>
      <div class="top-right">
        <div class="online">
          <span class="dot"></span>
          <span id="online-count">0 сидят</span>
        </div>
      </div>
    </div>

    <div class="stage">
      <div class="scene" id="scene">
        <div class="fire-glow" id="fire-glow"></div>
        <video id="fire-video" autoplay loop muted playsinline preload="auto">
          <source src="/sounds/fire.mp4" type="video/mp4">
        </video>
        <div class="people" id="people"></div>
      </div>
      <div class="replies" id="replies"></div>
    </div>

    <div class="say">
      <div class="say-inner">
        <textarea id="say-input" placeholder="Скажи что-нибудь..." rows="1"></textarea>
        <button id="say-btn">Сказать</button>
      </div>
      <div class="say-hint" id="say-hint"></div>
    </div>
  </main>
</div>

<!-- Модалка выбора ника -->
<div class="modal hidden" id="name-modal">
  <div class="modal-inner">
    <h2>Как тебя звать?</h2>
    <p class="modal-hint">Это имя увидят те, кто рядом. Можно взять любое — или оставить анонимом.</p>
    <input type="text" id="name-input" maxlength="30" placeholder="Имя" autocomplete="off">
    <label class="lock-row">
      <input type="checkbox" id="name-lock">
      <span>Запомнить меня — буду узнавать тебя при следующем заходе</span>
    </label>
    <div class="modal-actions">
      <button id="name-cancel">Отмена</button>
      <button id="name-ok">Сесть к огню</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
